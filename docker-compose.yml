version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: unitalks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  coturn:
    image: coturn/coturn
    container_name: unitalks-coturn
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    profiles:
      - turn

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: unitalks-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - TURN_HOST=${TURN_HOST:-}
      - TURN_PORT=3478
      - TURN_SECRET=${TURN_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
